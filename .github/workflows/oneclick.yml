name: 一键包·滚动最新（push main）

# 日常滚动产物：push main（打包相关路径）或手动触发，双平台各自构建平台专用瘦包，
# 冒烟后覆盖上传到滚动 release `oneclick-latest`（同名资产替换，不堆积）。
# 版本化正式发布（tag → 双包 release）见 `oneclick-release.yml`。
#
# 成本：私仓 macOS runner 按 10× 计费；一次运行 = mac + win 各一跑（约 1–2 分钟/腿）。

on:
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "web/**"
      - "src/**"
      - "tools/**"
      - "skills/**"
      - "examples/**"
      - "licenses/**"
      - "docs/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "README.md"
      - ".github/workflows/oneclick.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

concurrency:
  group: oneclick
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 构建平台专用瘦包
        shell: bash
        run: python packaging/build_package.py --platform ${{ matrix.platform }}
      - name: 冒烟 + sha256
        shell: bash
        run: python packaging/smoke_package.py oneclick-packages/${{ matrix.platform }}/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: oneclick-${{ matrix.platform }}
          path: oneclick-packages/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: 更新滚动 release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 覆盖上传到 oneclick-latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="oneclick-latest"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" \
              --title "一键包（滚动最新）" \
              --notes "YuE2 Studio 双平台一键包（瘦包，不含模型）。macOS 包只含 start.command，Windows 包只含 start.bat。首次启动只安装环境，随后到「模型」页下载模型（可切换国内镜像 / 国际直连）；详细步骤见包内《使用说明》。版本化正式发布见 tags（v*）。"
          fi
          for name in $(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'); do
            gh release delete-asset "$TAG" "$name" --repo "$REPO" --yes || true
          done
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --latest
          gh release view "$TAG" --repo "$REPO"
